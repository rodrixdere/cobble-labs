# Avisa de dependencias con vulnerabilidades o atrasadas. Van agrupadas en un
# solo PR por semana para no llenar la lista de PRs sueltos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencias:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
